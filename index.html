<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>存股北極熊：白熊 ETF 複利計算機</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f0f8ff; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        /* 自訂滑桿樣式 */
        input[type=range] {
            accent-color: #3b82f6;
        }
        /* 白熊對話框動畫 */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .bear-dialog { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-gray-800">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- 標題區 -->
        <header class="text-center space-y-2">
            <h1 class="text-3xl md:text-4xl font-black text-blue-800 tracking-wide">
                <i class="fa-solid fa-snowflake text-blue-400 mr-2"></i>存股北極熊：白熊 ETF 複利計算機
            </h1>
            <p class="text-gray-600 font-medium">設定目標，超越平均！讓白熊陪你算出未來的財富雪球 ❄️</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- 左側：參數控制面板 -->
            <div class="lg:col-span-4 glass-panel p-6 rounded-2xl shadow-xl space-y-6">
                <h2 class="text-xl font-bold text-gray-800 border-b pb-2"><i class="fa-solid fa-sliders mr-2"></i>投資設定</h2>
                
                <!-- 目前年齡 -->
                <div class="space-y-2">
                    <div class="flex justify-between">
                        <label class="font-medium text-gray-700">目前年齡 (歲)</label>
                        <span id="valAge" class="text-blue-600 font-bold">20 歲</span>
                    </div>
                    <input type="range" id="rangeAge" min="18" max="65" step="1" value="20" class="w-full h-2 rounded-lg appearance-none bg-gray-200">
                </div>

                <!-- 單筆投入 -->
                <div class="space-y-2">
                    <div class="flex justify-between">
                        <label class="font-medium text-gray-700">單筆本金 (元)</label>
                        <span id="valPrincipal" class="text-blue-600 font-bold">0</span>
                    </div>
                    <input type="range" id="rangePrincipal" min="0" max="1000000" step="10000" value="50000" class="w-full h-2 rounded-lg appearance-none bg-gray-200">
                </div>

                <!-- 每月定期定額 -->
                <div class="space-y-2">
                    <div class="flex justify-between">
                        <label class="font-medium text-gray-700">每月定期定額 (元)</label>
                        <span id="valMonthly" class="text-blue-600 font-bold">0</span>
                    </div>
                    <input type="range" id="rangeMonthly" min="0" max="100000" step="1000" value="8000" class="w-full h-2 rounded-lg appearance-none bg-gray-200">
                </div>

                <!-- 年化報酬率 -->
                <div class="space-y-2">
                    <div class="flex justify-between">
                        <label class="font-medium text-gray-700">預期年化報酬率 (%)</label>
                        <span id="valRate" class="text-blue-600 font-bold">0%</span>
                    </div>
                    <input type="range" id="rangeRate" min="1" max="20" step="0.5" value="6" class="w-full h-2 rounded-lg appearance-none bg-gray-200">
                </div>

                <!-- 投資年限 -->
                <div class="space-y-2">
                    <div class="flex justify-between">
                        <label class="font-medium text-gray-700">投資年限 (年)</label>
                        <span id="valYears" class="text-blue-600 font-bold">0年</span>
                    </div>
                    <input type="range" id="rangeYears" min="1" max="40" step="1" value="20" class="w-full h-2 rounded-lg appearance-none bg-gray-200">
                </div>

                <!-- 通膨開關 -->
                <div class="flex items-center justify-between pt-4 border-t border-gray-200">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-fire text-red-400"></i>
                        <label class="font-medium text-gray-700 text-sm">考慮 2% 通貨膨脹 (計算實質購買力)</label>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer shrink-0">
                        <input type="checkbox" id="toggleInflation" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
                    </label>
                </div>
            </div>

            <!-- 右側：結果展示與圖表 -->
            <div class="lg:col-span-8 flex flex-col space-y-6">
                <!-- 數據總覽卡片 (4格) -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-white p-3 rounded-xl shadow-md border-l-4 border-blue-500">
                        <p class="text-xs text-gray-500 font-bold">總投入本金</p>
                        <p class="text-xl font-bold text-gray-800 mt-1 truncate" id="outPrincipal">$0</p>
                    </div>
                    <div class="bg-white p-3 rounded-xl shadow-md border-l-4 border-green-500">
                        <p class="text-xs text-gray-500 font-bold">累積投資報酬</p>
                        <p class="text-xl font-bold text-green-600 mt-1 truncate" id="outInterest">$0</p>
                    </div>
                    <div class="bg-white p-3 rounded-xl shadow-md border-l-4 border-orange-400 relative">
                        <p class="text-xs text-gray-500 font-bold"><span id="lblTargetAge">X 歲</span> 同齡平均</p>
                        <p class="text-xl font-bold text-gray-800 mt-1 truncate" id="outAvgAsset">$0</p>
                        <span id="badgeCompare" class="absolute top-2 right-2 text-[10px] font-bold px-2 py-0.5 rounded text-white bg-gray-400">計算中</span>
                    </div>
                    <div class="bg-blue-600 p-3 rounded-xl shadow-md text-white">
                        <p class="text-xs text-blue-100 font-bold">期末總資產 <span id="lblInflation" class="text-[10px] text-yellow-300 hidden">(扣除通膨)</span></p>
                        <p class="text-2xl font-black mt-1 truncate" id="outTotal">$0</p>
                    </div>
                </div>

                <!-- 白熊互動對話框 -->
                <div class="flex items-start space-x-4 bg-white p-4 rounded-xl shadow-sm border border-blue-100 bear-dialog">
                    <div class="text-5xl">🐻‍❄️</div>
                    <div>
                        <h3 class="font-bold text-blue-800 text-lg">白熊分析師：</h3>
                        <p id="bearMessage" class="text-gray-700 mt-1 font-medium text-sm md:text-base">設定好目標，白熊陪你一步一步存股，穩穩累積財富！💪</p>
                    </div>
                </div>

                <!-- 圖表區 -->
                <div class="glass-panel p-4 rounded-2xl shadow-xl w-full h-[400px] relative">
                    <canvas id="growthChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM 元素選取
        const inputs = {
            age: document.getElementById('rangeAge'),
            principal: document.getElementById('rangePrincipal'),
            monthly: document.getElementById('rangeMonthly'),
            rate: document.getElementById('rangeRate'),
            years: document.getElementById('rangeYears'),
            inflation: document.getElementById('toggleInflation')
        };
        const displays = {
            age: document.getElementById('valAge'),
            principal: document.getElementById('valPrincipal'),
            monthly: document.getElementById('valMonthly'),
            rate: document.getElementById('valRate'),
            years: document.getElementById('valYears')
        };
        const outputs = {
            total: document.getElementById('outTotal'),
            principal: document.getElementById('outPrincipal'),
            interest: document.getElementById('outInterest'),
            avgAsset: document.getElementById('outAvgAsset'),
            targetAge: document.getElementById('lblTargetAge'),
            badgeCompare: document.getElementById('badgeCompare')
        };
        const lblInflation = document.getElementById('lblInflation');
        const bearMessage = document.getElementById('bearMessage');
        
        let chartInstance = null;

        // 格式化金錢 (包含負數處理的修復)
        const formatMoney = (num) => {
            const rounded = Math.round(num);
            return rounded < 0 
                ? '-$' + Math.abs(rounded).toLocaleString('en-US') 
                : '$' + rounded.toLocaleString('en-US');
        };

        // 模擬台灣各年齡層平均淨資產 (台幣)
        const avgAssetsTable = {
            18: 100000, 20: 300000, 25: 800000, 30: 2000000, 
            35: 3500000, 40: 5500000, 45: 8000000, 50: 11000000, 
            55: 14000000, 60: 17000000, 65: 20000000, 80: 22000000, 100: 22000000
        };

        // 根據年齡內插計算預估平均資產
        function getAvgAssetByAge(targetAge) {
            const ages = Object.keys(avgAssetsTable).map(Number).sort((a,b)=>a-b);
            if(targetAge <= ages[0]) return avgAssetsTable[ages[0]];
            if(targetAge >= ages[ages.length-1]) return avgAssetsTable[ages[ages.length-1]];
            for(let i=0; i<ages.length-1; i++) {
                if(targetAge >= ages[i] && targetAge <= ages[i+1]) {
                    const ratio = (targetAge - ages[i]) / (ages[i+1] - ages[i]);
                    return avgAssetsTable[ages[i]] + ratio * (avgAssetsTable[ages[i+1]] - avgAssetsTable[ages[i]]);
                }
            }
            return 0;
        }

        // 更新白熊狀態
        function updateBearVibe(rate, total, avgAsset, isInflationOn, isInterestNegative) {
            let msg = "";
            const ratio = total / avgAsset;

            if (isInterestNegative) {
                msg = "哎呀！加上通膨後，你實質的購買力其實在縮水喔！白熊建議你需要稍微提高預期報酬率或增加投入金額了！🧊💦";
            } else if (rate > 12) {
                msg = "哇！這個報酬率設定有點高喔！高報酬伴隨高風險，白熊提醒你要注意市場波動，別讓我的魚被吃掉了！📉🐟";
            } else if (ratio >= 2) {
                msg = "太狂了！你的資產已經遠遠海放同齡人！白熊封你為『極地財富管理大師』！👑🐻‍❄️";
            } else if (ratio >= 1.2) {
                msg = "太棒了！你的資產超越了同年齡的平均水準，跟著白熊繼續保持這個紀律！✨📈";
            } else if (ratio >= 0.8) {
                msg = "穩紮穩打！目前的規劃跟同齡人平均水準不相上下，我們繼續用時間把雪球滾大！❄️";
            } else {
                msg = "雖然目前還有點落後平均，但『提早開始、持續投入』就是最好的策略，白熊陪你一起追上進度！💪";
            }

            if(isInflationOn && ratio >= 1 && rate <= 12 && !isInterestNegative) {
                 msg += " (而且這是扣除通膨後的實質購買力喔！超讚！👍)";
            }

            bearMessage.innerText = msg;
        }

        // 核心計算與圖表更新邏輯
        function calculateAndUpdate() {
            // 讀取數值
            const currentAge = parseInt(inputs.age.value);
            const p = parseFloat(inputs.principal.value);
            const m = parseFloat(inputs.monthly.value);
            const r = parseFloat(inputs.rate.value) / 100;
            const y = parseInt(inputs.years.value);
            const useInflation = inputs.inflation.checked;
            const inflationRate = 0.02; // 2% 通膨

            // 更新顯示標籤
            displays.age.innerText = currentAge + ' 歲';
            displays.principal.innerText = formatMoney(p);
            displays.monthly.innerText = formatMoney(m);
            displays.rate.innerText = inputs.rate.value + '%';
            displays.years.innerText = y + ' 年';
            lblInflation.classList.toggle('hidden', !useInflation);

            let chartLabels = [];
            let chartPrincipalData = [];
            let chartInterestData = [];
            let chartAvgAssetData = []; 

            let currentTotal = p;
            let currentPrincipal = p;
            const monthlyRate = r / 12;

            for (let year = 1; year <= y; year++) {
                let projectedAge = currentAge + year;
                chartLabels.push(`${projectedAge} 歲`);
                chartAvgAssetData.push(Math.round(getAvgAssetByAge(projectedAge)));
                
                for (let month = 1; month <= 12; month++) {
                    currentTotal += m;
                    currentTotal *= (1 + monthlyRate);
                    currentPrincipal += m;
                }

                // 計算通膨扣除（計算實質購買力）
                let displayTotal = currentTotal;
                if (useInflation) {
                    displayTotal = currentTotal / Math.pow(1 + inflationRate, year);
                }

                // 允許 currentInterest 為負數，真實反映被通膨吃掉的狀況
                let currentInterest = displayTotal - currentPrincipal;

                chartPrincipalData.push(Math.round(currentPrincipal));
                chartInterestData.push(Math.round(currentInterest));
            }

            const finalAge = currentAge + y;
            const finalPrincipal = currentPrincipal;
            const finalTotal = chartPrincipalData[y-1] + chartInterestData[y-1];
            const finalInterest = finalTotal - finalPrincipal;
            const finalAvgAsset = chartAvgAssetData[y-1];
            const isInterestNegative = finalInterest < 0;

            // 更新結果卡片
            outputs.principal.innerText = formatMoney(finalPrincipal);
            
            // 顯示利息，若是負數，加上紅色警告色
            outputs.interest.innerText = formatMoney(finalInterest);
            outputs.interest.className = isInterestNegative ? "text-xl font-bold text-red-500 mt-1 truncate" : "text-xl font-bold text-green-600 mt-1 truncate";

            outputs.total.innerText = formatMoney(finalTotal);
            outputs.targetAge.innerText = `${finalAge} 歲`;
            outputs.avgAsset.innerText = formatMoney(finalAvgAsset);

            // 更新 Badge 狀態
            if(finalTotal > finalAvgAsset) {
                outputs.badgeCompare.innerText = "🏆 領先";
                outputs.badgeCompare.className = "absolute top-2 right-2 text-[10px] font-bold px-2 py-0.5 rounded text-white bg-green-500 shadow-sm";
            } else {
                outputs.badgeCompare.innerText = "🏃 追趕中";
                outputs.badgeCompare.className = "absolute top-2 right-2 text-[10px] font-bold px-2 py-0.5 rounded text-white bg-gray-400 shadow-sm";
            }

            // 更新白熊狀態
            updateBearVibe(parseFloat(inputs.rate.value), finalTotal, finalAvgAsset, useInflation, isInterestNegative);

            // 更新圖表
            updateChart(chartLabels, chartPrincipalData, chartInterestData, chartAvgAssetData);
        }

        // 初始化/更新 Chart.js
        function updateChart(labels, principalData, interestData, avgAssetData) {
            const ctx = document.getElementById('growthChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.data.labels = labels;
                chartInstance.data.datasets[0].data = principalData;
                chartInstance.data.datasets[1].data = interestData;
                chartInstance.data.datasets[2].data = avgAssetData;
                chartInstance.update();
                return;
            }

            Chart.defaults.font.family = "'Noto Sans TC', sans-serif";
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            type: 'bar',
                            label: '累積本金',
                            data: principalData,
                            backgroundColor: 'rgba(59, 130, 246, 0.8)', // Blue
                            stack: 'barGroup', // 修復點 1：設定專屬的 stack ID 給長條圖
                            order: 2
                        },
                        {
                            type: 'bar',
                            label: '複利孳息',
                            data: interestData,
                            backgroundColor: 'rgba(34, 197, 94, 0.8)', // Green
                            stack: 'barGroup', // 修復點 1：跟累積本金放在同一個 stack 讓它們疊加
                            order: 2
                        },
                        {
                            type: 'line',
                            label: '同齡平均資產',
                            data: avgAssetData,
                            borderColor: 'rgba(249, 115, 22, 1)', // Orange
                            backgroundColor: 'rgba(249, 115, 22, 0.2)',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            pointHitRadius: 10,
                            fill: false,
                            tension: 0.3,
                            stack: 'lineGroup', // 修復點 1：給折線圖獨立的 stack ID，防止它錯亂疊加
                            order: 1 
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) label += ': ';
                                    if (context.parsed.y !== null) {
                                        label += formatMoney(context.parsed.y);
                                    }
                                    return label;
                                }
                            }
                        },
                        legend: { position: 'top' }
                    },
                    scales: {
                        x: { stacked: true, grid: { display: false } },
                        y: { 
                            stacked: true,
                            ticks: {
                                callback: function(value) {
                                    if(value >= 10000) return (value/10000) + '萬';
                                    return value;
                                }
                            }
                        }
                    }
                }
            });
        }

        // 綁定事件監聽器 (滑桿拖曳及開關即時觸發)
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', calculateAndUpdate);
        });

        // 確保視窗改變大小時，圖表可以正常 Resize
        window.addEventListener('resize', () => {
            if (chartInstance) chartInstance.resize();
        });

        // 初始計算
        calculateAndUpdate();
    </script>
</body>
</html>
